# Declarative Automation Bundle for the Allianz ML workshop (case-escalation model).
# Deploy:  databricks bundle deploy -t dev --var="schema=ml_<your_user>"
bundle:
  name: allianz_ml_workshop

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the workshop
    default: adp_workshop
  schema:
    description: Schema holding the tables, feature table and model
    default: ml_shared

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    variables:
      schema: ml_prod
